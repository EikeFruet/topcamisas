<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja Camisas de Futebol</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
    }

    header {
      background: linear-gradient(90deg, #16a34a, #22c55e);
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .produtos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
      height: 200px;
      object-fit: cover;
    }

    .card h3 {
      margin: 10px 0 5px;
    }

    .price {
      color: #22c55e;
      font-weight: bold;
      margin-bottom: 10px;
    }

    button {
      background: #22c55e;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #16a34a;
    }

    .carrinho {
      position: fixed;
      right: 20px;
      top: 20px;
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      width: 220px;
    }

    .carrinho h3 {
      margin-bottom: 10px;
    }

    .item {
      font-size: 14px;
      margin-bottom: 5px;
      border-bottom: 1px solid #334155;
      padding-bottom: 5px;
    }

    .total {
      margin-top: 10px;
      font-weight: bold;
      color: #22c55e;
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      background: #020617;
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ Loja de Camisas de Futebol</h1>
  <p>As melhores camisas dos seus times favoritos</p>
</header>

<div class="container">

    <a href="https://wa.me/5541988706428?text=Olá! Quero comprar a camisa do Palmeiras" target="_blank" style="text-decoration: none;">
        <button style="cursor: pointer; background-color: #25D366; color: white; border: none; padding: 10px; border-radius: 5px; width: 100%;">
            Comprar no WhatsApp
        </button>

</div>

    <a href="https://wa.me/5541988706428?text=Olá! Quero comprar a camisa do Flamengo" target="_blank" style="text-decoration: none;">
        <button style="cursor: pointer; background-color: #25D366; color: white; border: none; padding: 10px; border-radius: 5px; width: 100%;">
            Comprar no WhatsApp

</div>

    <div class="card">
      <img src="imagen/1000201708.png" alt="Camisa Coritiba" />

</html>
