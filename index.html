<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja Camisas de Futebol</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
    }

    header {
      background: linear-gradient(90deg, #16a34a, #22c55e);
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .produtos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
      height: 200px;
      object-fit: cover;
    }

    .card h3 {
      margin: 10px 0 5px;
    }

    .price {
      color: #22c55e;
      font-weight: bold;
      margin-bottom: 10px;
    }

    button {
      background: #22c55e;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #16a34a;
    }

    .carrinho {
      position: fixed;
      right: 20px;
      top: 20px;
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      width: 220px;
    }

    .carrinho h3 {
      margin-bottom: 10px;
    }

    .item {
      font-size: 14px;
      margin-bottom: 5px;
      border-bottom: 1px solid #334155;
      padding-bottom: 5px;
    }

    .total {
      margin-top: 10px;
      font-weight: bold;
      color: #22c55e;
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      background: #020617;
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ Loja de Camisas de Futebol</h1>
  <p>As melhores camisas dos seus times favoritos</p>
</header>

<div class="container">

  <div class="produtos">

    <div class="card">
      <img src="imagen/1000200648.png" />
      <h3>Camisa palmeiras</h3>
      <p class="price">R$ 129,90</p>
      <button onclick="addCarrinho('Camisa palmeiras', 129.90)">Comprar</button>
    </div>

    <div class="card">
      <img src="https://imagen/1000200932.png" />
      <h3>Camisa flamengo</h3>
      <p class="price">R$ 129,90</p>
      <button onclick="addCarrinho('Camisa flamengo', 129.90)">Comprar</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1521412644187-c49fa049e84d" />
      <h3>Camisa Real Madrid</h3>
      <p class="price">R$ 149,90</p>
      <button onclick="addCarrinho('Camisa Real Madrid', 149.90)">Comprar</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1521412644187-c49fa049e84d" />
      <h3>Camisa Barcelona</h3>
      <p class="price">R$ 149,90</p>
      <button onclick="addCarrinho('Camisa Barcelona', 149.90)">Comprar</button>
    </div>

  </div>
</div>

<div class="carrinho">
  <h3>🛒 Carrinho</h3>
  <div id="itens"></div>
  <div class="total" id="total">Total: R$ 0,00</div>
</div>

<footer>
  © 2026 Loja de Camisas de Futebol - Todos os direitos reservados
</footer>

<script>
  let carrinho = [];
  let total = 0;

  function addCarrinho(nome, preco) {
    carrinho.push({ nome, preco });
    total += preco;
    atualizar();
  }

  function atualizar() {
    let lista = document.getElementById("itens");
    lista.innerHTML = "";

    carrinho.forEach(item => {
      lista.innerHTML += `<div class="item">${item.nome} - R$ ${item.preco.toFixed(2)}</div>`;
    });

    document.getElementById("total").innerText =
      "Total: R$ " + total.toFixed(2);
  }
</script>

</body>
</html>
